version: "1.0.0.0"
targetAbi: "10.11.11.0"
framework: "net9.0"
# Shown as the plugin's developer in Jellyfin's plugin catalogue and details page.
owner: "Warna"
overview: "Unified TV series, anime and film release calendar for Jellyfin."
description: >
  ReleaseHub adds a unified release calendar, tracking and discovery experience for TV series, anime
  and films directly inside Jellyfin. It reads your existing libraries, resolves each title against
  TVMaze, AnimeSchedule or TMDb using the provider IDs Jellyfin already holds, and shows what airs or
  releases next, including the next film of a saga you already own. It never modifies, renames, moves
  or downloads any media, and requires no Sonarr, Radarr or other external service.
category: "General"
artifacts:
  - "Jellyfin.Plugin.ReleaseHub.dll"
changelog: |
  First release.

  - Calendar, Upcoming, Following and Discover, with All / Anime / TV series / Films filters
  - TVMaze, AnimeSchedule and TMDb, each swappable behind a common provider contract
  - Films and sagas: the next entry of a collection already in the library
  - One-year horizon, at no extra request cost: each provider declares how far ahead it is worth asking
  - Incremental "load more" in Upcoming, stopping honestly at the horizon rather than on empty pages
  - French and English throughout, with no user-facing string hardcoded in the interface
  - Strictly read-only: never renames, moves, deletes or downloads media, and never edits metadata
  - Rate limiting, request de-duplication, 429 and Retry-After handling, and an SQLite cache
  - Optional user-facing entry point through the File Transformation plugin
  - Web interface page, including a toggle for the Abyss theme's spotlight carousel
