# Shown as the plugin's developer in Jellyfin's plugin catalogue and details page.
owner: "Warna"
overview: "Unified TV series and anime release calendar for Jellyfin."
description: >
  ReleaseHub adds a unified release calendar, tracking and discovery experience for TV series and
  anime directly inside Jellyfin. It reads your existing libraries, resolves each series against
  TVMaze or AnimeSchedule using the provider IDs Jellyfin already holds, and shows what airs next.
  It never modifies, renames, moves or downloads any media, and requires no Sonarr, Radarr or other
  external service.
category: "General"
