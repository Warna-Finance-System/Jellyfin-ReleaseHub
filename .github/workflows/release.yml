name: Release

# Publishing is driven by the version in build.yaml. Bump it, push to main, and this workflow tags
# that version, builds it, publishes the release asset and prepends the matching entry to
# manifest.json, so servers subscribed to the repository see the update without anyone editing the
# manifest by hand. Pushing a v* tag or dispatching manually does the same thing on demand.
#
# The tag is what makes this safe to run on every push: a version whose tag already exists is not
# released again, so ordinary commits pass straight through.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Leave empty to use the version in build.yaml.'
        required: false

permissions:
  contents: write

jobs:
  # Deciding is separated from publishing so that the common case — a commit that does not bump the
  # version — costs one short job instead of a checkout, a restore and a build.
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version to publish
        id: resolve
        run: |
          set -euo pipefail

          # A tag push and a manual dispatch are both deliberate requests, so they publish whatever
          # they name. Only an ordinary commit to main has to be judged, and the judgement is simply
          # whether its version has been released already.
          DELIBERATE=false

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REASON="tag ${GITHUB_REF_NAME} was pushed"
            DELIBERATE=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' build.yaml | head -1)
            fi
            REASON="requested manually"
            DELIBERATE=true
          else
            # build.yaml is the single place the version is declared; the manifest and the release
            # both follow it, so there is no second number to keep in step.
            VERSION=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' build.yaml | head -1)
            REASON="build.yaml declares $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No version could be resolved. Check that build.yaml declares one."
            exit 1
          fi

          # Jellyfin compares plugin versions as four-part System.Version values, so reject anything
          # that would install but then sort unpredictably against other releases.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' must have four numeric parts, for example 1.0.0.1"
            exit 1
          fi

          TAG="v$VERSION"

          if [ "$DELIBERATE" = "true" ]; then
            echo "Publishing $VERSION ($REASON)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            REASON="$VERSION is already released as $TAG"
            echo "Nothing to do: $REASON."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $VERSION ($REASON)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "### Release decision"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Reason | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Needed so the manifest commit can be pushed back onto the default branch.
          ref: main
          fetch-depth: 0

      - name: Read target ABI from build.yaml
        id: abi
        run: |
          ABI=$(grep -E '^targetAbi:' build.yaml | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$ABI" ]; then
            echo "::error::targetAbi is missing from build.yaml"
            exit 1
          fi
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Jellyfin 10.11 runs on net9.0; the plugin must target it exactly.
          dotnet-version: '9.0.x'

      - name: Build
        run: |
          dotnet build src/Jellyfin.Plugin.ReleaseHub/Jellyfin.Plugin.ReleaseHub.csproj \
            -c Release \
            -o artifacts \
            -p:Version=${{ needs.decide.outputs.version }} \
            -p:AssemblyVersion=${{ needs.decide.outputs.version }} \
            -p:FileVersion=${{ needs.decide.outputs.version }}

      - name: Run tests
        run: dotnet test -c Release --nologo

      - name: Package
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          ZIP="ReleaseHub_${VERSION}.zip"

          # Jellyfin extracts the archive straight into plugins/<name>_<version>/, so the assembly has
          # to sit at the archive root rather than inside a folder.
          mkdir -p package
          cp artifacts/Jellyfin.Plugin.ReleaseHub.dll package/
          (cd package && zip -r "../$ZIP" .)

          CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Packaged $ZIP with checksum $CHECKSUM"

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          REPO="${{ github.repository }}"

          # The changelog lives in build.yaml as a folded block, which is also what Jellyfin's own
          # plugin tooling reads. Pulled out here so the release page and the plugin catalogue say the
          # same thing rather than drifting apart.
          awk '
            /^changelog:/ { inblock = 1; next }
            inblock && /^[^[:space:]]/ { inblock = 0 }
            inblock { sub(/^[[:space:]]+/, ""); print }
          ' build.yaml > changelog.txt

          {
            if [ -s changelog.txt ]; then
              echo "## What's new"
              echo ""
              cat changelog.txt
              echo ""
            fi
          } > release-notes.md

          # Written to a file rather than inlined: a release body contains backticks and newlines
          # that do not survive shell interpolation intact.
          cat >> release-notes.md <<'NOTES'
          ## Installation

          **Via the plugin repository (recommended)**

          Dashboard -> Plugins -> Repositories -> `+`, then add the manifest URL below, install
          **Jellyfin ReleaseHub** from the catalogue, and restart Jellyfin.

          ```
          MANIFEST_URL
          ```

          **Manual**

          Download the archive below and extract it into
          `<jellyfin-data>/plugins/ReleaseHub_VERSION/`, then restart Jellyfin.

          ## Compatibility

          | | |
          |---|---|
          | Jellyfin target ABI | `TARGET_ABI` |
          | Framework | net9.0 |
          | Archive MD5 | `CHECKSUM` |

          Plugins are only loaded at startup, so Jellyfin must be restarted after installing.
          NOTES

          # Substituted afterwards so the heredoc itself stays literal.
          sed -i \
            -e "s#MANIFEST_URL#https://raw.githubusercontent.com/${REPO}/main/manifest.json#" \
            -e "s#VERSION#${VERSION}#g" \
            -e "s#TARGET_ABI#${{ steps.abi.outputs.abi }}#" \
            -e "s#CHECKSUM#${{ steps.package.outputs.checksum }}#" \
            release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          name: ReleaseHub ${{ needs.decide.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.zip }}
          # Creates the tag on the commit being released when it does not exist yet, which is what
          # makes a version bump on main enough to publish.
          target_commitish: ${{ github.sha }}
          # Appends GitHub's own categorised changelog underneath our body.
          generate_release_notes: true
          make_latest: true

      - name: Update manifest.json
        run: |
          python3 scripts/update_manifest.py \
            "${{ needs.decide.outputs.version }}" \
            "${{ steps.abi.outputs.abi }}" \
            "${{ steps.package.outputs.checksum }}" \
            "${{ steps.package.outputs.zip }}"

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet manifest.json; then
            echo "manifest.json already lists this version; nothing to commit."
            exit 0
          fi

          git add manifest.json
          git commit -m "chore: publish ReleaseHub ${{ needs.decide.outputs.version }} in the plugin manifest"
          git push origin main

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ needs.decide.outputs.version }}\` |"
            echo "| Tag | \`${{ needs.decide.outputs.tag }}\` |"
            echo "| Archive | \`${{ steps.package.outputs.zip }}\` |"
            echo "| MD5 | \`${{ steps.package.outputs.checksum }}\` |"
            echo "| Target ABI | \`${{ steps.abi.outputs.abi }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
