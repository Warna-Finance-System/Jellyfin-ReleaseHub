name: Release

# Publishing is driven by the version in build.yaml. Bump it, push to main, and this workflow tags
# that version, builds it once per Jellyfin generation listed under `targets`, publishes every
# archive on one release and adds one manifest.json entry per archive, so servers subscribed to the
# repository see the update without anyone editing the manifest by hand. Pushing a v* tag or
# dispatching manually does the same thing on demand.
#
# The tag is what makes this safe to run on every push: a version whose tag already exists is not
# released again, so ordinary commits pass straight through.
#
# Versions: the tag carries ReleaseHub's version (v1.1.0); each archive carries that version plus its
# Jellyfin generation (1.1.0.11 for 10.11, 1.1.0.12 for 12). scripts/build_targets.py explains why.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Leave empty to use the version in build.yaml.'
        required: false

permissions:
  contents: write

jobs:
  # Deciding is separated from publishing so that the common case — a commit that does not bump the
  # version — costs one short job instead of a checkout, a restore and a build.
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version to publish
        id: resolve
        run: |
          set -euo pipefail

          # A tag push and a manual dispatch are both deliberate requests, so they publish whatever
          # they name. Only an ordinary commit to main has to be judged, and the judgement is simply
          # whether its version has been released already.
          DELIBERATE=false

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REASON="tag ${GITHUB_REF_NAME} was pushed"
            DELIBERATE=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' build.yaml | head -1)
            fi
            REASON="requested manually"
            DELIBERATE=true
          else
            # build.yaml is the single place the version is declared; the manifest and the release
            # both follow it, so there is no second number to keep in step.
            VERSION=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' build.yaml | head -1)
            REASON="build.yaml declares $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No version could be resolved. Check that build.yaml declares one."
            exit 1
          fi

          # Three parts: each build appends its Jellyfin generation as the fourth, which is what makes
          # Jellyfin (comparing four-part System.Version values) pick the right build per server.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' must have three numeric parts, for example 1.1.0"
            exit 1
          fi

          TAG="v$VERSION"

          if [ "$DELIBERATE" = "true" ]; then
            echo "Publishing $VERSION ($REASON)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            REASON="$VERSION is already released as $TAG"
            echo "Nothing to do: $REASON."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $VERSION ($REASON)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "### Release decision"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Reason | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Needed so the manifest commit can be pushed back onto the default branch.
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # One SDK per Jellyfin generation: net9.0 builds for 10.11, net10.0 for 12.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Run tests
        # Runs the suite once per target framework, so neither build ships untested.
        run: dotnet test -c Release --nologo

      - name: Build and package every target
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          PROJECT=src/Jellyfin.Plugin.ReleaseHub/Jellyfin.Plugin.ReleaseHub.csproj

          # One line per Jellyfin generation: generation, framework, targetAbi, plugin version, label.
          # It also validates build.yaml, and fails the job before anything is published.
          python3 scripts/build_targets.py "$VERSION" > targets.tsv
          mkdir -p dist
          : > packages.tsv

          # Read through descriptor 3 so that nothing inside the loop can swallow the remaining lines
          # from stdin.
          while IFS=$'\t' read -r GENERATION FRAMEWORK ABI PLUGIN_VERSION LABEL <&3; do
            OUT="artifacts/$FRAMEWORK"
            ZIP="ReleaseHub_${PLUGIN_VERSION}.zip"

            dotnet build "$PROJECT" -c Release -f "$FRAMEWORK" -o "$OUT" --nologo \
              -p:Version="$PLUGIN_VERSION" \
              -p:AssemblyVersion="$PLUGIN_VERSION" \
              -p:FileVersion="$PLUGIN_VERSION"

            # Jellyfin extracts the archive straight into plugins/<name>_<version>/, so the assembly
            # has to sit at the archive root rather than inside a folder.
            rm -rf package && mkdir package
            cp "$OUT/Jellyfin.Plugin.ReleaseHub.dll" package/
            (cd package && zip -r "../dist/$ZIP" .)

            CHECKSUM=$(md5sum "dist/$ZIP" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$LABEL" "$PLUGIN_VERSION" "$ABI" "$FRAMEWORK" "$ZIP" "$CHECKSUM" >> packages.tsv
            echo "Packaged $ZIP for Jellyfin $LABEL (targetAbi $ABI, $FRAMEWORK), checksum $CHECKSUM"
          done 3< targets.tsv

      - name: Compose release notes
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # The changelog lives in build.yaml as a folded block, which is also what Jellyfin's own
          # plugin tooling reads. Pulled out here so the release page and the plugin catalogue say the
          # same thing rather than drifting apart.
          awk '
            /^changelog:/ { inblock = 1; next }
            inblock && /^[^[:space:]]/ { inblock = 0 }
            inblock { sub(/^[[:space:]]+/, ""); print }
          ' build.yaml > changelog.txt

          {
            if [ -s changelog.txt ]; then
              echo "## What's new"
              echo ""
              cat changelog.txt
              echo ""
            fi
          } > release-notes.md

          # Written to a file rather than inlined: a release body contains backticks and newlines
          # that do not survive shell interpolation intact.
          cat >> release-notes.md <<'NOTES'
          ## Installation

          **Via the plugin repository (recommended)**

          Dashboard -> Plugins -> Repositories -> `+`, then add the manifest URL below, install
          **Jellyfin ReleaseHub** from the catalogue, and restart Jellyfin. The catalogue installs the
          build that matches your server on its own.

          ```
          MANIFEST_URL
          ```

          **Manual**

          Download the archive for your Jellyfin version from the table below and extract it into
          `<jellyfin-data>/plugins/ReleaseHub_<plugin version>/`, then restart Jellyfin.

          ## Compatibility

          | Jellyfin | Archive | Plugin version | Target ABI | Framework | Archive MD5 |
          |---|---|---|---|---|---|
          NOTES

          # Newest server generation first.
          tac packages.tsv | while IFS=$'\t' read -r LABEL PLUGIN_VERSION ABI FRAMEWORK ZIP CHECKSUM; do
            echo "| $LABEL | \`$ZIP\` | \`$PLUGIN_VERSION\` | \`$ABI\` | $FRAMEWORK | \`$CHECKSUM\` |"
          done >> release-notes.md

          {
            echo ""
            echo "Plugins are only loaded at startup, so Jellyfin must be restarted after installing."
          } >> release-notes.md

          # Substituted afterwards so the heredoc itself stays literal.
          sed -i -e "s#MANIFEST_URL#https://raw.githubusercontent.com/${REPO}/main/manifest.json#" release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          name: ReleaseHub ${{ needs.decide.outputs.version }}
          body_path: release-notes.md
          # Every archive on the one release: one per Jellyfin generation.
          files: dist/*.zip
          # Creates the tag on the commit being released when it does not exist yet, which is what
          # makes a version bump on main enough to publish.
          target_commitish: ${{ github.sha }}
          # Appends GitHub's own categorised changelog underneath our body.
          generate_release_notes: true
          make_latest: true

      - name: Update manifest.json
        run: |
          set -euo pipefail

          # One entry per archive. update_manifest.py keeps the list sorted newest first, so the order
          # of this loop does not matter.
          while IFS=$'\t' read -r LABEL PLUGIN_VERSION ABI FRAMEWORK ZIP CHECKSUM <&3; do
            python3 scripts/update_manifest.py "$PLUGIN_VERSION" "$ABI" "$CHECKSUM" "$ZIP" \
              --tag "${{ needs.decide.outputs.tag }}"
          done 3< packages.tsv

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet manifest.json; then
            echo "manifest.json already lists this version; nothing to commit."
            exit 0
          fi

          git add manifest.json
          git commit -m "chore: publish ReleaseHub ${{ needs.decide.outputs.version }} in the plugin manifest"
          git push origin main

      - name: Summarise
        run: |
          {
            echo "### Published ReleaseHub ${{ needs.decide.outputs.version }} (\`${{ needs.decide.outputs.tag }}\`)"
            echo ""
            echo "| Jellyfin | Archive | Plugin version | Target ABI | Framework | MD5 |"
            echo "|---|---|---|---|---|---|"
            tac packages.tsv | while IFS=$'\t' read -r LABEL PLUGIN_VERSION ABI FRAMEWORK ZIP CHECKSUM; do
              echo "| $LABEL | \`$ZIP\` | \`$PLUGIN_VERSION\` | \`$ABI\` | $FRAMEWORK | \`$CHECKSUM\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
