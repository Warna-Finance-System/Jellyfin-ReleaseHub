name: Release

# Publishing is driven entirely by tags: pushing v1.0.0.1 builds that version, publishes the release
# asset, and prepends the matching entry to manifest.json so Jellyfin servers subscribed to the
# repository see the update without anyone editing the manifest by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.0.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Needed so the manifest commit can be pushed back onto the default branch.
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Jellyfin compares plugin versions as four-part System.Version values, so reject anything
          # that would install but then sort unpredictably against other releases.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' must have four numeric parts, for example 1.0.0.1"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag when dispatched manually
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Annotated rather than lightweight: it carries an author and a date, which is what
          # `git describe` and the releases page expect to find.
          git tag -a "$TAG" -m "ReleaseHub ${{ steps.version.outputs.version }}"
          git push origin "$TAG"

      - name: Read target ABI from build.yaml
        id: abi
        run: |
          ABI=$(grep -E '^targetAbi:' build.yaml | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$ABI" ]; then
            echo "::error::targetAbi is missing from build.yaml"
            exit 1
          fi
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Jellyfin 10.11 runs on net9.0; the plugin must target it exactly.
          dotnet-version: '9.0.x'

      - name: Build
        run: |
          dotnet build src/Jellyfin.Plugin.ReleaseHub/Jellyfin.Plugin.ReleaseHub.csproj \
            -c Release \
            -o artifacts \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Run tests
        run: dotnet test -c Release --nologo

      - name: Package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="ReleaseHub_${VERSION}.zip"

          # Jellyfin extracts the archive straight into plugins/<name>_<version>/, so the assembly has
          # to sit at the archive root rather than inside a folder.
          mkdir -p package
          cp artifacts/Jellyfin.Plugin.ReleaseHub.dll package/
          (cd package && zip -r "../$ZIP" .)

          CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Packaged $ZIP with checksum $CHECKSUM"

      - name: Compose release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          # Written to a file rather than inlined: a release body contains backticks and newlines
          # that do not survive shell interpolation intact.
          cat > release-notes.md <<'NOTES'
          ## Installation

          **Via the plugin repository (recommended)**

          Dashboard -> Plugins -> Repositories -> `+`, then add the manifest URL below, install
          **Jellyfin ReleaseHub** from the catalogue, and restart Jellyfin.

          ```
          MANIFEST_URL
          ```

          **Manual**

          Download the archive below and extract it into
          `<jellyfin-data>/plugins/ReleaseHub_VERSION/`, then restart Jellyfin.

          ## Compatibility

          | | |
          |---|---|
          | Jellyfin target ABI | `TARGET_ABI` |
          | Framework | net9.0 |
          | Archive MD5 | `CHECKSUM` |

          Plugins are only loaded at startup, so Jellyfin must be restarted after installing.
          NOTES

          # Substituted afterwards so the heredoc itself stays literal.
          sed -i             -e "s#MANIFEST_URL#https://raw.githubusercontent.com/${REPO}/main/manifest.json#"             -e "s#VERSION#${VERSION}#g"             -e "s#TARGET_ABI#${{ steps.abi.outputs.abi }}#"             -e "s#CHECKSUM#${{ steps.package.outputs.checksum }}#"             release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ReleaseHub ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.zip }}
          # Appends GitHub's own categorised changelog underneath our body.
          generate_release_notes: true
          make_latest: true

      - name: Update manifest.json
        run: |
          python3 scripts/update_manifest.py \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.abi.outputs.abi }}" \
            "${{ steps.package.outputs.checksum }}" \
            "${{ steps.package.outputs.zip }}"

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet manifest.json; then
            echo "manifest.json already lists this version; nothing to commit."
            exit 0
          fi

          git add manifest.json
          git commit -m "chore: publish ReleaseHub ${{ steps.version.outputs.version }} in the plugin manifest"
          git push origin main
