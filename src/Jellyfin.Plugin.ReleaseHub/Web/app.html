<!-- ReleaseHub application shell.
     Served at /web/ConfigurationPage?name=releasehub-app and rendered by jellyfin-web's view loader.
     Scripts inside a configurationpage view ARE executed by loadView, which is why the bootstrap is
     inlined as a module loader rather than relying on a plain <script src>. -->
<div id="releaseHubPage" data-role="page" class="page type-interior pluginConfigurationPage fullWidthContent">
  <div class="content-primary">
    <div id="releaseHubRoot" class="releasehub-root"></div>
  </div>
  <script type="text/javascript">
    (function () {
      var CSS_ID = 'releasehub-css';
      if (!document.getElementById(CSS_ID)) {
        var link = document.createElement('link');
        link.id = CSS_ID;
        link.rel = 'stylesheet';
        link.href = ApiClient.getUrl('web/ConfigurationPage', { name: 'releasehub.css' });
        document.head.appendChild(link);
      }

      function mount() {
        window.ReleaseHub.mount(document.querySelector('#releaseHubPage .releasehub-root'));
      }

      if (window.ReleaseHub && window.ReleaseHub.mount) {
        mount();
      } else {
        var script = document.createElement('script');
        script.src = ApiClient.getUrl('web/ConfigurationPage', { name: 'releasehub-app.js' });
        script.onload = mount;
        document.head.appendChild(script);
      }
    })();
  </script>
</div>
